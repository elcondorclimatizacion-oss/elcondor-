<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Logo Dorso - El Cóndor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        @media print {
            @page {
                size: A4;
                margin: 0;
            }
            body {
                margin: 0;
                background-color: #ffffff;
            }
        }
        body {
            margin: 0;
            font-family: 'Outfit', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ffffff;
        }
        .container {
            width: 210mm;
            height: 297mm;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15mm 25mm;
            box-sizing: border-box;
        }
        
        /* Logo Header */
        .logo-header {
            width: 80mm;
            height: 80mm;
            margin-bottom: 2mm;
        }
        
        /* Services List */
        .services-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 5.5mm;
            margin-bottom: 7mm;
            padding-left: 5mm;
        }
        .service-item {
            display: flex;
            align-items: center;
            gap: 6mm;
        }
        .icon-circle {
            width: 14mm;
            height: 14mm;
            border-radius: 50%;
            background-color: #0f2d59;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }
        .icon-circle svg {
            width: 9mm;
            height: 9mm;
        }
        .service-text {
            display: flex;
            flex-direction: column;
            gap: 0.8mm;
        }
        .service-title {
            font-weight: 800;
            font-size: 17px;
            color: #0f2d59;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .service-desc {
            font-weight: 600;
            font-size: 13px;
            color: #4b5563;
            line-height: 1.35;
        }
        
        /* Divider */
        .divider {
            width: 100%;
            height: 1.5px;
            background-color: #0f2d59;
            margin-bottom: 6mm;
        }
        
        /* Contact Section */
        .contact-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4mm;
        }
        .contact-item {
            display: flex;
            align-items: center;
            gap: 3.5mm;
        }
        .wa-icon {
            width: 7mm;
            height: 7mm;
        }
        .contact-number {
            font-weight: 800;
            font-size: 24px;
            color: #0f2d59;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Logo Header -->
        <div class="logo-header">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
                <defs>
                    <style>
                        .roof { fill: none; stroke: #0f2d59; stroke-width: 18; stroke-linecap: round; stroke-linejoin: round; }
                        .chimney { fill: #0f2d59; }
                        .window-frame { fill: none; stroke: #0f2d59; stroke-width: 4; }
                        .window-line { stroke: #0f2d59; stroke-width: 3; }
                        .wave { fill: none; stroke: #00a3e0; stroke-width: 6; stroke-linecap: round; }
                        .bolt { fill: #00a3e0; }
                        .cam-body { fill: #0f2d59; }
                        .cam-lens { fill: #08162b; }
                        .cam-visor { stroke: #0f2d59; stroke-width: 3; stroke-linecap: round; }
                        .cam-bracket { fill: none; stroke: #0f2d59; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
                        .ac-body { fill: none; stroke: #00a3e0; stroke-width: 4.5; }
                        .ac-line { stroke: #00a3e0; stroke-width: 2.5; }
                        .ac-flow { fill: none; stroke: #00a3e0; stroke-width: 2.5; stroke-linecap: round; }
                        .text-servicios { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 40px; fill: #0f2d59; letter-spacing: 5px; text-anchor: middle; }
                        .text-integrales { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 40px; fill: #0f2d59; letter-spacing: 5px; text-anchor: middle; }
                        .text-hogar { font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 20px; fill: #00a3e0; letter-spacing: 6px; text-anchor: middle; }
                    </style>
                </defs>
                <path class="roof" d="M 135,212 L 250,115 L 365,212" />
                <path class="chimney" d="M 310,160 L 310,125 L 328,125 L 328,175 Z" />
                <rect class="window-frame" x="235" y="137" width="30" height="30" />
                <line class="window-line" x1="250" y1="137" x2="250" y2="167" />
                <line class="window-line" x1="235" y1="152" x2="265" y2="152" />
                <path class="bolt" d="M 188,183 L 168,214 L 184,214 L 176,239 L 198,206 L 181,206 Z" />
                <path class="cam-bracket" d="M 242,212 L 242,228 L 254,228" />
                <rect class="cam-body" x="220" y="195" width="45" height="19" rx="4" transform="rotate(-25 242 205)" />
                <rect class="cam-lens" x="215" y="195" width="6" height="19" rx="1" transform="rotate(-25 242 205)" />
                <path class="cam-visor" d="M 211,191 L 256,212" />
                <rect class="ac-body" x="282" y="195" width="56" height="22" rx="3.5" />
                <line class="ac-line" x1="287" y1="211" x2="333" y2="211" />
                <path class="ac-flow" d="M 292,223 C 291,228 295,232 294,237" />
                <path class="ac-flow" d="M 310,223 C 309,228 313,232 312,237" />
                <path class="ac-flow" d="M 328,223 C 327,228 331,232 330,237" />
                <path class="wave" d="M 145,255 C 200,270 290,240 355,255" />
                <text class="text-servicios" x="252" y="325">SERVICIOS</text>
                <text class="text-integrales" x="252" y="375">INTEGRALES</text>
                <text class="text-hogar" x="253" y="425">— DEL HOGAR —</text>
            </svg>
        </div>
        
        <!-- Services List -->
        <div class="services-list">
            <!-- Electricity -->
            <div class="service-item">
                <div class="icon-circle">
                    <svg viewBox="0 0 100 100">
                        <!-- lightning bolt -->
                        <path d="M 54,22 L 34,51 L 51,51 L 46,78 L 68,43 L 51,43 Z" fill="#ffffff" />
                    </svg>
                </div>
                <div class="service-text">
                    <div class="service-title">ELECTRICIDAD</div>
                    <div class="service-desc">Instalaciones, reparaciones<br>y mantenimiento eléctrico.</div>
                </div>
            </div>
            
            <!-- CCTV -->
            <div class="service-item">
                <div class="icon-circle">
                    <svg viewBox="0 0 100 100">
                        <!-- Camera Bracket -->
                        <path d="M 44,53 L 44,70 L 58,70" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
                        <!-- Camera Body -->
                        <rect x="25" y="35" width="48" height="20" rx="4.5" transform="rotate(-25 49 45)" fill="#ffffff" />
                        <rect x="20" y="35" width="6" height="20" rx="1" transform="rotate(-25 49 45)" fill="#e5e7eb" />
                        <path d="M 17,31 L 62,52" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
                    </svg>
                </div>
                <div class="service-text">
                    <div class="service-title">CÁMARAS DE SEGURIDAD</div>
                    <div class="service-desc">Instalación y configuración<br>de sistemas de vigilancia.</div>
                </div>
            </div>
            
            <!-- AC Unit -->
            <div class="service-item">
                <div class="icon-circle">
                    <svg viewBox="0 0 100 100">
                        <rect x="20" y="35" width="60" height="24" rx="4" fill="none" stroke="#ffffff" stroke-width="5" />
                        <line x1="25" y1="52" x2="75" y2="52" stroke="#ffffff" stroke-width="3" />
                        <!-- Air Flow -->
                        <path d="M 30,68 C 29,73 33,77 32,82" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" />
                        <path d="M 50,68 C 49,73 53,77 52,82" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" />
                        <path d="M 70,68 C 69,73 73,77 72,82" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" />
                    </svg>
                </div>
                <div class="service-text">
                    <div class="service-title">AIRES ACONDICIONADOS</div>
                    <div class="service-desc">Instalación, reparación<br>y mantenimiento.</div>
                </div>
            </div>
        </div>
        
        <!-- Divider -->
        <div class="divider"></div>
        
        <!-- Contact Section -->
        <div class="contact-section">
            <div class="contact-item">
                <div class="wa-icon">
                    <svg viewBox="0 0 100 100" width="100%" height="100%">
                        <circle cx="50" cy="50" r="46" fill="#25D366" />

                    </svg>
                </div>
                <div class="contact-number">1169272348</div>
            </div>
            
            <div class="contact-item">
                <div class="wa-icon">
                    <svg viewBox="0 0 100 100" width="100%" height="100%">
                        <circle cx="50" cy="50" r="46" fill="#25D366" />
                        <path d="M 50,22 C 34.5,22 22,34.5 22,50 C 22,55.5 23.6,60.7 26.3,65.1 L 22.5,79 L 36.9,75.3 C 40.9,77.7 45.3,78 50,78 C 65.5,78 78,65.5 78,50 C 78,34.5 65.5,22 50,22 Z M 64.2,60.2 C 63.4,62.4 59.8,64.2 57.3,64.7 C 55.6,65 53.4,65.2 46,62.1 C 36.5,58.2 30.4,48.5 29.9,47.9 C 29.4,47.2 25.8,42.5 25.8,37.6 C 25.8,32.7 28.3,30.3 29.3,29.3 C 30.1,28.5 31.4,28.1 32.6,28.1 C 33,28.1 33.4,28.1 33.7,28.1 C 34.6,28.1 35.1,28.2 35.7,29.6 C 36.5,31.5 38.4,36.1 38.6,36.6 C 38.8,37.1 38.8,37.5 38.5,38.1 C 38.2,38.7 38,38.9 37.5,39.5 C 37,40.1 36.6,40.5 36.1,41.1 C 35.7,41.6 35.1,42.2 35.7,43.2 C 36.3,44.2 38.4,47.6 41.5,50.4 C 45.5,54 48.7,55.1 49.7,55.5 C 50.7,55.9 51.7,55.8 52.4,55 C 53.2,54 54.3,52.6 55.4,51.1 C 56.2,50 57.1,50.3 58.1,50.7 C 59.1,51.1 64.5,53.8 65.6,54.3 C 66.7,54.8 67.4,55.1 67.7,55.6 C 68,56.1 68,58.3 67.2,60.2 Z" fill="#ffffff" />
                    </svg>
                </div>
                <div class="contact-number">1126139527</div>
            </div>
        </div>
    </div>
</body>
</html>
